[package]
name = "insert_core_wasm"
description = "insert_core for the browser preview (CLAUDE.md §6.1, §7.4): JSON in, JSON out, drawn lines as plain straight segments (no arcs, no layers). Never gets the export writers."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
# cdylib: the .wasm for the browser. rlib: lets the native tests link it.
crate-type = ["cdylib", "rlib"]

# Not the workspace lints: wasm-bindgen's generated glue uses `unsafe`, which the
# workspace forbids. Hand-written `unsafe` is still refused.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[dependencies]
insert_core = { path = "../insert_core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Pinned exactly: the `wasm-bindgen` CLI that writes the JS glue must be the same version
# (scripts/build-wasm.sh checks).
wasm-bindgen = "=0.2.129"
