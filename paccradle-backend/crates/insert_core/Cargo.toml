[package]
name = "insert_core"
description = "Paccradle geometry core: inserts, boxes, hinges and checks (all units mm). Built native for the API and as WASM for the browser preview."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Production file writers and the free test print and PNG preview (M1-B): server only.
# The browser build never turns this on.
export = ["dep:tiny-skia", "dep:ttf-parser"]

[dependencies]
i_overlay.workspace = true
serde.workspace = true
thiserror.workspace = true
tiny-skia = { workspace = true, optional = true }
ttf-parser = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
