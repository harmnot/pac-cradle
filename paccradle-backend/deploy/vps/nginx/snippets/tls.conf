# TLS for every paccradle site: Mozilla "intermediate" profile, ECDHE only
# (TLS 1.3, and TLS 1.2 with forward secrecy and AEAD ciphers for older
# phones). Certificates are ECDSA from Let's Encrypt. No OCSP stapling:
# Let's Encrypt no longer runs OCSP.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ecdh_curve X25519:prime256v1:secp384r1;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_session_timeout 1d;
ssl_session_cache shared:paccradleTLS:10m;
ssl_session_tickets off;
