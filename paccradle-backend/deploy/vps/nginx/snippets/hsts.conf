# Browsers use HTTPS only, for two years, subdomains included (api-dev too).
# `preload` matches the landing page's own policy. Submitting paccradle.com at
# hstspreload.org would make this permanent in browsers: only do it on purpose.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
