# Defaults for every paccradle HTTPS server (server context).
server_tokens off;

# Slow clients can't hold connections open forever.
client_header_timeout 15s;
client_body_timeout 30s;
send_timeout 30s;
keepalive_timeout 30s;
limit_conn paccradle_conn 100;

# Hidden files (.git, .env, ...) are never served, whatever is upstream.
location ~ /\.(?!well-known/) {
    return 404;
}
