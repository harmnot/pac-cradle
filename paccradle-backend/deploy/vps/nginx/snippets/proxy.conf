# Proxying to the paccradle containers on 127.0.0.1 (server context).
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;

# The real client address. The API reads X-Real-IP (RATE_LIMIT_CLIENT_IP_HEADER).
# Both headers are overwritten, never appended to, so clients can't spoof them.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;

# The API assigns request IDs itself (UUID v7); one sent by a client is dropped.
proxy_set_header X-Request-Id "";

proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;
proxy_hide_header X-Powered-By;
